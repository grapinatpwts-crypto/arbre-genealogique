<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap">
  <style>
    body { margin: 0; font-family: 'Archivo', system-ui, sans-serif; }
    a { color: #9A5233; text-decoration: none; } a:hover { color: #7A3F26; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #F3EDE1; color: #1F1A14; display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden; position: relative">

  <div style="padding: 60px 18px 0; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 12px; min-height: 44px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4A4137" stroke-width="1.7" stroke-linecap="square"><path d="M15 5l-7 7 7 7" /></svg>
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px; min-width: 0">
        <span style="font-size: 9.5px; letter-spacing: 0.17em; text-transform: uppercase; color: #8A7D6D; font-weight: 600">Arbre</span>
        <span style="font-family: 'EB Garamond', Georgia, serif; font-size: 20px; font-weight: 600; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Famille Vasseur — Prigent</span>
      </div>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="#4A4137"><circle cx="5" cy="12" r="1.7" /><circle cx="12" cy="12" r="1.7" /><circle cx="19" cy="12" r="1.7" /></svg>
    </div>

    <div style="display: flex; background: #E8E1D3; border: 1px solid #DCD2C0; border-radius: 4px; padding: 3px; gap: 3px">
      <button onClick="{{ versAscendants }}" style="flex-grow: 1; height: 38px; border: 0; border-radius: 2px; cursor: pointer; font-family: 'Archivo', sans-serif; font-size: 13.5px; font-weight: 600; background: {{fondAsc}}; color: {{encreAsc}}; box-shadow: {{ombreAsc}}">Ascendants</button>
      <button onClick="{{ versDescendants }}" style="flex-grow: 1; height: 38px; border: 0; border-radius: 2px; cursor: pointer; font-family: 'Archivo', sans-serif; font-size: 13.5px; font-weight: 600; background: {{fondDesc}}; color: {{encreDesc}}; box-shadow: {{ombreDesc}}">Descendants</button>
    </div>

    <div style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #6E6357">
      <span style="font-size: 9.5px; letter-spacing: 0.15em; text-transform: uppercase; font-weight: 600; color: #8A7D6D">{{ancre}}</span>
      <span style="font-family: 'EB Garamond', Georgia, serif; font-size: 15px; color: #1F1A14; flex-grow: 1">{{ancreNom}}</span>
      <span style="border: 1px solid #C9BCA6; border-radius: 2px; padding: 5px 9px; font-size: 11px; font-weight: 600; color: #4A4137">Recentrer</span>
    </div>
  </div>

  <div style="flex-grow: 1; margin: 14px 0 0; position: relative; overflow: hidden; background-color: #EFE9DD; background-image: radial-gradient(#D9CDB8 1px, transparent 1px); background-size: 22px 22px; border-top: 1px solid #E4DBCB; border-bottom: 1px solid #E4DBCB">

    <div style="position: absolute; left: -165px; top: 50%; margin-top: -200px; width: 720px; height: 400px">
      <svg width="720" height="400" viewBox="0 0 720 400" fill="none" style="position: absolute; left: 0; top: 0">
        <path d="{{traits}}" stroke="#B9A98E" stroke-width="1.3" />
      </svg>
      <sc-for list="{{cartes}}" as="c" hint-placeholder-count="7">
        <div onClick="{{ c.pick }}" style="position: absolute; left: {{c.x}}px; top: {{c.y}}px; width: {{c.w}}px; height: {{c.h}}px; background: {{c.fond}}; border: 1px solid {{c.bordure}}; border-radius: 4px; box-sizing: border-box; padding: 9px 11px; display: flex; flex-direction: column; justify-content: center; gap: 3px; cursor: pointer; box-shadow: {{c.ombre}}">
          <span style="font-family: 'EB Garamond', Georgia, serif; font-size: {{c.taille}}px; font-weight: 600; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.nom}}</span>
          <span style="font-size: 11px; color: #6E6357; font-variant-numeric: tabular-nums; white-space: nowrap">{{c.dates}}</span>
          <span style="font-size: 10px; color: #9C8F7D; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.lieu}}</span>
        </div>
      </sc-for>
    </div>

    <div style="position: absolute; right: 14px; bottom: 14px; display: flex; flex-direction: column; gap: 1px; background: #C9BCA6; border: 1px solid #C9BCA6; border-radius: 4px; overflow: hidden">
      <div style="width: 44px; height: 44px; background: #FBF7EF; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4A4137" stroke-width="1.7" stroke-linecap="square"><path d="M12 5v14M5 12h14" /></svg>
      </div>
      <div style="width: 44px; height: 44px; background: #FBF7EF; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4A4137" stroke-width="1.7" stroke-linecap="square"><path d="M5 12h14" /></svg>
      </div>
      <div style="width: 44px; height: 44px; background: #FBF7EF; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9A5233" stroke-width="1.7"><circle cx="12" cy="12" r="3" /><path d="M12 3v3M12 18v3M3 12h3M18 12h3" /></svg>
      </div>
    </div>

    <sc-if value="{{selection}}" hint-placeholder-val="{{ true }}">
      <div style="position: absolute; left: 0; right: 0; bottom: 0; background: #FBF7EF; border-top: 1px solid #C9BCA6; padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 14px">
        <div style="display: flex; align-items: flex-start; gap: 12px">
          <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0">
            <span style="font-family: 'EB Garamond', Georgia, serif; font-size: 24px; font-weight: 600; line-height: 1.1">{{selection.nom}}</span>
            <span style="font-size: 12.5px; color: #6E6357; font-variant-numeric: tabular-nums">{{selection.dates}} · {{selection.lieu}}</span>
          </div>
          <div onClick="{{ fermer }}" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-grow: 0">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#8A7D6D" stroke-width="1.8" stroke-linecap="square"><path d="M6 6l12 12M18 6L6 18" /></svg>
          </div>
        </div>
        <div style="display: flex; gap: 10px">
          <button style="flex-grow: 1; height: 46px; background: #9A5233; color: #FBF7EF; border: 0; border-radius: 4px; font-family: 'Archivo', sans-serif; font-size: 14.5px; font-weight: 600; cursor: pointer">Ouvrir la fiche</button>
          <button style="flex-grow: 1; height: 46px; background: none; border: 1px solid #C9BCA6; border-radius: 4px; font-family: 'Archivo', sans-serif; font-size: 14.5px; font-weight: 600; color: #4A4137; cursor: pointer">Rattacher</button>
        </div>
      </div>
    </sc-if>
  </div>

  <div style="display: flex; padding: 8px 6px 26px; background: #F3EDE1">
    <sc-for list="{{onglets}}" as="o" hint-placeholder-count="4">
      <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 8px 0; cursor: pointer">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="{{o.encre}}" stroke-width="1.6" stroke-linecap="square"><path d="{{o.icone}}" /></svg>
        <span style="font-size: 10px; font-weight: 600; letter-spacing: 0.03em; color: {{o.encre}}">{{o.nom}}</span>
      </div>
    </sc-for>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    // `vue` est la bascule Ascendants/Descendants, `sel` la personne touchée.
    // Les deux jeux de cartouches ont leurs coordonnées en dur : le canevas
    // fait 720 px de large, décalé à gauche pour que la souche tombe au centre
    // des 390 px de l'écran — le reste dépasse, c'est ce qu'on va paner.
    this.state = { vue: 'asc', sel: 'marcel' };
  }

  cartouches() {
    if (this.state.vue === 'asc') {
      return [
        { id: 'marcel', x: 10, y: 0, nom: 'Marcel Vasseur', dates: '† 1929 – 2011', lieu: 'Saumur (49)' },
        { id: 'suzanne', x: 190, y: 0, nom: 'Suzanne Chauvet', dates: '† 1932 – 2019', lieu: 'Cholet (49)' },
        { id: 'yann', x: 360, y: 0, nom: 'Yann Prigent', dates: '† 1930 – 1998', lieu: 'Concarneau (29)' },
        { id: 'anna', x: 540, y: 0, nom: 'Anna Le Gall', dates: '1934', lieu: 'Douarnenez (29)' },
        { id: 'etienne', x: 100, y: 132, nom: 'Étienne Vasseur', dates: '1958', lieu: 'Angers (49)' },
        { id: 'helene', x: 450, y: 132, nom: 'Hélène Prigent', dates: '1961', lieu: 'Quimper (29)' },
        { id: 'camille', x: 265, y: 262, w: 170, h: 74, taille: 18, nom: 'Camille Vasseur', dates: '1989', lieu: 'Nantes (44)' }
      ];
    }
    return [
      { id: 'marcel', x: 190, y: 0, nom: 'Marcel Vasseur', dates: '† 1929 – 2011', lieu: 'Saumur (49)' },
      { id: 'suzanne', x: 360, y: 0, nom: 'Suzanne Chauvet', dates: '† 1932 – 2019', lieu: 'Cholet (49)' },
      { id: 'etienne', x: 35, y: 132, nom: 'Étienne Vasseur', dates: '1958', lieu: 'Angers (49)' },
      { id: 'jeanpierre', x: 275, y: 132, nom: 'Jean-Pierre Vasseur', dates: '† 1960 – 1961', lieu: 'Angers (49)' },
      { id: 'claire', x: 515, y: 132, nom: 'Claire Vasseur', dates: '1963', lieu: 'Angers (49)' },
      { id: 'camille', x: 5, y: 264, nom: 'Camille Vasseur', dates: '1989', lieu: 'Nantes (44)' },
      { id: 'thomas', x: 155, y: 264, nom: 'Thomas Vasseur', dates: '1992', lieu: 'Nantes (44)' },
      { id: 'lucie', x: 375, y: 264, nom: 'Lucie Berthier', dates: '1990', lieu: 'Tours (37)' },
      { id: 'paul', x: 545, y: 264, nom: 'Paul Berthier', dates: '1994', lieu: 'Tours (37)' }
    ];
  }

  renderVals() {
    const asc = this.state.vue === 'asc';
    const brut = this.cartouches();
    const cartes = brut.map((c) => {
      const actif = c.id === this.state.sel;
      return {
        x: c.x, y: c.y, w: c.w || 150, h: c.h || 60, taille: c.taille || 15,
        nom: c.nom, dates: c.dates, lieu: c.lieu,
        fond: '#FBF7EF',
        bordure: actif ? '#9A5233' : '#C9BCA6',
        ombre: actif ? '0 0 0 3px rgba(154,82,51,.18)' : '0 1px 0 rgba(31,26,20,.05)',
        pick: () => this.setState({ sel: c.id })
      };
    });
    const sel = brut.find((c) => c.id === this.state.sel);
    const onglet = (nom, icone, actif) => ({ nom, icone, encre: actif ? '#9A5233' : '#9C8F7D' });
    return {
      cartes,
      traits: asc
        ? 'M85 60V96 M265 60V96 M85 96H265 M175 96V132 M435 60V96 M615 60V96 M435 96H615 M525 96V132 M175 192V228 M525 192V228 M175 228H525 M350 228V262'
        : 'M340 30H360 M350 30V96 M110 96H590 M110 96V132 M350 96V132 M590 96V132 M110 192V228 M80 228H230 M80 228V264 M230 228V264 M590 192V228 M450 228H620 M450 228V264 M620 228V264',
      ancre: asc ? 'Ascendance de' : 'Descendance de',
      ancreNom: asc ? 'Camille Vasseur' : 'Marcel Vasseur & Suzanne Chauvet',
      fondAsc: asc ? '#FBF7EF' : 'transparent',
      encreAsc: asc ? '#1F1A14' : '#8A7D6D',
      ombreAsc: asc ? '0 1px 2px rgba(31,26,20,.12)' : 'none',
      fondDesc: asc ? 'transparent' : '#FBF7EF',
      encreDesc: asc ? '#8A7D6D' : '#1F1A14',
      ombreDesc: asc ? 'none' : '0 1px 2px rgba(31,26,20,.12)',
      selection: sel ? { nom: sel.nom, dates: sel.dates, lieu: sel.lieu } : null,
      fermer: () => this.setState({ sel: null }),
      versAscendants: () => this.setState({ vue: 'asc', sel: 'marcel' }),
      versDescendants: () => this.setState({ vue: 'desc', sel: 'etienne' }),
      onglets: [
        onglet('Arbre', 'M12 21v-6M6 15v-4M18 15v-4M6 11h12M6 11V7M18 11V7M9 3h6v4H9z', true),
        onglet('Personnes', 'M9 11a3 3 0 100-6 3 3 0 000 6zM3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M17 8h4M19 6v4', false),
        onglet('Sources', 'M6 3h8l4 4v14H6zM14 3v4h4M9 12h6M9 16h4', false),
        onglet('Membres', 'M8 11a3 3 0 100-6 3 3 0 000 6zM2 20c0-3.3 2.7-6 6-6s6 2.7 6 6M16 5.5a3 3 0 010 5.8M18 14.2c2.4.7 4 2.9 4 5.8', false)
      ]
    };
  }
}
</script>
</body>
</html>
