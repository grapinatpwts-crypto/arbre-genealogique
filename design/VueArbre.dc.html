<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;vueInitiale&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;asc&quot;,&quot;options&quot;:[&quot;asc&quot;,&quot;desc&quot;],&quot;tsType&quot;:&quot;string&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#9A5233&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#9A5233&quot;,&quot;#3D5A8C&quot;,&quot;#4A6B43&quot;]},&quot;usure&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
// Parchemin unique : pas d'encadré, les noms sont écrits *dans* la peau.
// Deux gradients d'âge remontent avec les siècles — la teinte du support et la
// main qui écrit. Le bas est un relevé récent, le haut un terrier du XVIe.
// L'époque se lit sans dépendre d'un webfont : famille générique, capitales
// à l'ancienne, approche, italique, corps et encre changent par siècle. Les
// polices d'époque, si elles chargent, ne font qu'accentuer l'écart.
const PLUME = "'Tangerine', 'Great Vibes', 'Snell Roundhand', 'Apple Chancery', 'Monotype Corsiva', 'Lucida Calligraphy', 'Lucida Handwriting', 'Segoe Script', 'Ink Free', 'Brush Script MT', cursive";

const ERES = {
  // Une famille par tranche : Calibri après 1900, Times avant 1900, anglaise
  // avant 1700 — la police porte la datation, l'italique et l'approche l'accentuent.
  contemporain: { police: "Calibri, 'Segoe UI', system-ui, sans-serif", italique: 'normal', variante: 'normal', espace: '0.005em', encre: '#2C2317', bavure: 'none', chiffres: 'tabular-nums', nomSiecle: 'XXIᵉ siècle', epoque: 'Relevé contemporain' },
  moderne: { police: "Calibri, 'Segoe UI', system-ui, sans-serif", italique: 'normal', variante: 'normal', espace: '0.03em', encre: '#33291C', bavure: 'none', chiffres: 'tabular-nums', nomSiecle: 'XXᵉ siècle', epoque: 'État civil, XXᵉ siècle' },
  belleEpoque: { police: "'Times New Roman', Times, serif", italique: 'normal', variante: 'small-caps', espace: '0.1em', encre: '#33261A', bavure: '0 0 0.5px rgba(51,38,26,0.35)', chiffres: 'normal', nomSiecle: 'XIXᵉ siècle', epoque: 'Registres d’état civil, XIXᵉ' },
  // À partir de l'Empire on passe à la main courante : l'anglaise dit l'époque
  // même sans webfont, la générique « cursive » existant sur tous les systèmes.
  empire: { police: "'Times New Roman', Times, serif", italique: 'italic', variante: 'normal', espace: '0.12em', encre: '#2B2014', bavure: '0 0 0.8px rgba(43,32,20,0.4)', chiffres: 'normal', nomSiecle: 'Début XIXᵉ', epoque: 'Actes révolutionnaires et impériaux' },
  // Avant 1700 : on passe la liste complète des anglaises installées d'office
  // (macOS puis Windows) avant le générique, et on penche la ligne — la main
  // reste visible même si aucune police calligraphique n'est disponible.
  ancienRegime: { police: PLUME, penche: 'skewX(-13deg)', italique: 'italic', variante: 'normal', espace: '0.02em', encre: '#291E12', bavure: '0 0 1px rgba(41,30,18,0.45)', chiffres: 'normal', nomSiecle: 'XVIIᵉ siècle', epoque: 'Registres paroissiaux, Ancien Régime' },
  renaissance: { police: PLUME, penche: 'skewX(-17deg)', italique: 'italic', variante: 'normal', espace: '0.04em', encre: '#241A0F', bavure: '0 0 1.3px rgba(36,26,15,0.5)', chiffres: 'normal', nomSiecle: 'XVIᵉ siècle', epoque: 'Terrier seigneurial, XVIᵉ' }
};

// Trait de plume : deux courbes en S refermées, fine du côté du parent et
// épaisse du côté de l'enfant — un stroke d'épaisseur constante faisait câble.
function plume(x0, y0, x1, y1, w0, w1, dev) {
  const k = (y1 - y0) * 0.62;
  const a = x0 + dev, b = x1 - dev;
  return `M ${x0 - w0 / 2} ${y0} C ${a - w0 / 2} ${y0 + k} ${b - w1 / 2} ${y1 - k} ${x1 - w1 / 2} ${y1}` +
    ` L ${x1 + w1 / 2} ${y1} C ${b + w1 / 2} ${y1 - k} ${a + w0 / 2} ${y0 + k} ${x0 + w0 / 2} ${y0} Z`;
}

// Le bloc de texte n'a pas la même hauteur selon l'époque (corps et interlignes
// varient) : tous les décalages verticaux — alliance, filiation, repère de
// siècle — se déduisent de cette mesure au lieu d'être des constantes.
function corps(ere) {
  const vieux = ere === 'renaissance' || ere === 'ancienRegime' || ere === 'empire';
  const taille = ere === 'renaissance' ? 26 : ere === 'ancienRegime' ? 24 : ere === 'empire' ? 22 : 19;
  const tailleDate = vieux ? 17 : 13.5;
  const tailleLieu = vieux ? 15 : 12;
  // Deux lignes de nom sont TOUJOURS réservées : qu'un nom passe à la ligne ou
  // non, la hauteur réelle du bloc est celle qu'on calcule ici, donc les
  // décalages des traits de plume ne peuvent plus tomber dans le texte.
  const lh = Math.ceil(taille * 1.14);
  const hNom = lh * 2;
  const h = hNom + 2 + 3 + tailleDate * 1.3 + 3 + tailleLieu * 1.3;
  return { taille, tailleDate, tailleLieu, lh, hNom, demi: h / 2 };
}

// Bord déchiqueté : contour généré, plus mordu en haut (le côté ancien).
function dechirure(largeur, hauteur) {
  let g = 4711;
  const r = () => { g = (g * 9301 + 49297) % 233280; return g / 233280; };
  const p = [];
  const amp = y => 5 + 13 * (1 - y / hauteur);
  for (let x = 0; x <= largeur; x += 26) p.push([x + (r() - 0.5) * 8, amp(0) * r()]);
  for (let y = 40; y <= hauteur - 40; y += 46) p.push([largeur - amp(y) * r(), y]);
  for (let x = largeur; x >= 0; x -= 30) p.push([x, hauteur - 7 * r()]);
  for (let y = hauteur - 40; y >= 40; y -= 46) p.push([amp(y) * r(), y]);
  return 'polygon(' + p.map(q => `${q[0].toFixed(1)}px ${q[1].toFixed(1)}px`).join(', ') + ')';
}

const DESC = [
  { ere: 'moderne', gens: [
    { id: 'marcel', nom: 'Marcel Vasseur', dates: '1929 – 2011', lieu: 'Saumur (49)', src: 3 },
    { id: 'suzanne', nom: 'Suzanne Chauvet', dates: '1932 – 2019', lieu: 'Cholet (49)', src: 1, epouse: 'marcel' }
  ] },
  { ere: 'contemporain', gens: [
    { id: 'etienne', nom: 'Étienne Vasseur', dates: '1958', lieu: 'Angers (49)', src: 1, enfants: [] },
    { id: 'jeanpierre', nom: 'Jean-Pierre Vasseur', dates: '1960 – 1961', lieu: 'Angers (49)', src: 2, enfants: [] },
    { id: 'claire', nom: 'Claire Vasseur', dates: '1963', lieu: 'Angers (49)', src: 0, enfants: [] }
  ] },
  { ere: 'contemporain', gens: [
    { id: 'camille', nom: 'Camille Vasseur', dates: '1989', lieu: 'Nantes (44)', src: 2 },
    { id: 'thomas', nom: 'Thomas Vasseur', dates: '1992', lieu: 'Nantes (44)', src: 0 },
    { id: 'lucie', nom: 'Lucie Berthier', dates: '1990', lieu: 'Tours (37)', src: 1 },
    { id: 'paul', nom: 'Paul Berthier', dates: '1994', lieu: 'Tours (37)', src: 0 }
  ] }
];

// Dans la vue descendante les liens sont posés à l'envers : on relie chaque
// parent de la rangée du dessus à ses enfants de la rangée du dessous.
DESC[0].gens[0].enfants = ['etienne', 'jeanpierre', 'claire'];
DESC[1].gens[0].enfants = ['camille', 'thomas'];
DESC[1].gens[2].enfants = ['lucie', 'paul'];

const PAS = 168;
const MARGE = 96;
// Le parchemin fait juste la largeur de l'écran à l'échelle d'entrée : pas de
// bande de fond sur les côtés, et le texte reste lisible sans zoomer.
const LARGE = 560;
const ECH = 0.7;

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { vue: props.vueInitiale || 'asc', sel: 'camille', echelle: 0.44, tx: 0, ty: 0, glisse: null, initial: true };
  }

  componentDidMount() {
    this._fin = () => this.setState({ glisse: null });
    this._bouge = e => {
      const g = this.state.glisse;
      if (!g) return;
      this.setState({ tx: g.tx + (e.clientX - g.px), ty: g.ty + (e.clientY - g.py) });
    };
    window.addEventListener('mouseup', this._fin);
    window.addEventListener('mousemove', this._bouge);
    this.recadrer(this.state.vue);
  }
  componentWillUnmount() {
    window.removeEventListener('mouseup', this._fin);
    window.removeEventListener('mousemove', this._bouge);
  }

  // Le cadrage d'entrée montre le bas du parchemin — le présent — et laisse
  // devi 'ner l'usure qui monte.
  recadrer(vue) {
    const r = this.disposition(vue);
    // 286 = bas de la fenêtre de canevas moins la feuille de sélection : la
    // rangée la plus récente doit rester visible au chargement.
    this.setState({ echelle: ECH, tx: (390 - LARGE * ECH) / 2, ty: 286 - r.hauteur * ECH });
  }

  disposition(vueForcee) {
    const vue = vueForcee || this.state.vue;
    const asc = vue === 'asc';
    const rangees = asc ? ASC : DESC;
    const hauteur = MARGE * 2 + (rangees.length - 1) * PAS;
    const pos = {};
    const lignes = rangees.map((r, i) => {
      // En ascendance le présent est en bas ; en descendance il descend.
      const y = asc ? hauteur - MARGE - i * PAS : MARGE + i * PAS;
      if (r.lacune) return { y, lacune: r.lacune, indice: i };
      const n = r.gens.length;
      const large = n > 3 ? 128 : n > 2 ? 165 : 205;
      const pas = LARGE / n;
      r.gens.forEach((g, j) => {
        pos[g.id] = { x: pas * (j + 0.5), y, w: large, ere: r.ere, indice: i, gens: g };
      });
      return { y, gens: r.gens, ere: r.ere, indice: i };
    });
    return { rangees, lignes, pos, hauteur, asc, total: rangees.length };
  }

  renderVals() {
    const d = this.disposition();
    const { pos, hauteur, asc } = d;
    const sourceVisible = this.props.usure !== false;

    // Facteur d'âge : 0 pour la rangée la plus récente, 1 pour la plus ancienne.
    const age = i => (d.total > 1 ? i / (d.total - 1) : 0);

    const mentions = [];
    const filiations = [];
    const unions = [];
    const fioritures = [];
    const lacunes = [];
    const siecles = [];
    let dernierSiecle = null;

    d.lignes.forEach(l => {
      const a = sourceVisible ? age(l.indice) : 0;
      if (l.lacune) {
        lacunes.push({ y: l.y, texte: '· · ·  ' + l.lacune + '  · · ·', o: (0.75 - a * 0.2).toFixed(2) });
        return;
      }
      const e = ERES[l.ere];
      const c = corps(l.ere);
      if (e.nomSiecle !== dernierSiecle) {
        dernierSiecle = e.nomSiecle;
        siecles.push({ nom: e.nomSiecle, police: e.police, y: l.y - c.demi - 34, o: (0.5 - a * 0.15).toFixed(2) });
      }
      l.gens.forEach(g => {
        const p = pos[g.id];
        const actif = g.id === this.state.sel;
        mentions.push({
          x: p.x.toFixed(0), y: l.y, w: p.w,
          nom: g.nom, dates: g.dates, lieu: g.lieu,
          police: e.police, italique: e.italique, espace: e.espace, variante: e.variante, penche: e.penche || 'none',
          encre: e.encre, bavure: e.bavure, chiffres: e.chiffres,
          taille: c.taille, tailleDate: c.tailleDate, tailleLieu: c.tailleLieu, hNom: c.hNom, lh: c.lh,
          o: (1 - a * 0.28).toFixed(2),
          souligne: actif ? '#9A5233' : 'transparent',
          pick: () => this.setState({ sel: g.id })
        });
      });

      // Trait d'alliance : une accolade légère sous le couple, pas un cadre.
      l.gens.filter(g => g.epouse && pos[g.epouse]).forEach(g => {
        const a1 = pos[g.epouse], a2 = pos[g.id];
        const y = l.y + c.demi + 14;
        const mi = (a1.x + a2.x) / 2;
        unions.push({
          d: `M ${a1.x} ${y - 7} C ${a1.x} ${y + 3} ${mi - 26} ${y + 3} ${mi} ${y + 1}` +
            ` C ${mi + 26} ${y + 3} ${a2.x} ${y + 3} ${a2.x} ${y - 7}` +
            ` C ${a2.x - 1.2} ${y + 1.5} ${mi + 26} ${y + 5} ${mi} ${y + 3.2}` +
            ` C ${mi - 26} ${y + 5} ${a1.x + 1.2} ${y + 1.5} ${a1.x} ${y - 7} Z`,
          o: (0.72 - a * 0.18).toFixed(2)
        });
      });

      // Filiation : descente à main levée depuis le couple vers l'enfant.
      const paires = {};
      l.gens.forEach(g => (g.enfants || []).forEach(idEnf => {
        if (!pos[idEnf]) return;
        (paires[idEnf] = paires[idEnf] || []).push(pos[g.id]);
      }));
      Object.keys(paires).forEach(idEnf => {
        const par = paires[idEnf];
        const enf = pos[idEnf];
        const mx = par.reduce((s, p) => s + p.x, 0) / par.length;
        // L'enfant est toujours la rangée du dessous, dans les deux vues.
        const y0 = l.y + c.demi + 20;
        const y1 = enf.y - corps(enf.ere).demi - 14;
        // Un dévers latéral, même à la verticale : c'est ce qui fait le S de plume.
        const dev = (enf.x >= mx ? 1 : -1) * (16 + Math.min(26, Math.abs(enf.x - mx) * 0.18));
        filiations.push({
          d: plume(mx, y0, enf.x, y1, 1.6, 5.4, dev),
          o: (0.86 - a * 0.16).toFixed(2)
        });
      });
    });

    // Quelques traits de plume au bas du parchemin — la main du relevé récent.
    const yPied = hauteur - 34;
    fioritures.push({ d: `M 190 ${yPied} C 236 ${yPied - 8} 324 ${yPied + 8} 370 ${yPied}`, o: '0.35' });
    fioritures.push({ d: `M 222 ${yPied + 7} C 258 ${yPied + 2} 302 ${yPied + 12} 338 ${yPied + 7}`, o: '0.22' });

    const selPos = pos[this.state.sel];
    const g = selPos && selPos.gens;
    const selection = g ? {
      nom: g.nom, dates: g.dates, lieu: g.lieu,
      epoque: ERES[selPos.ere].epoque,
      mentionSource: g.src > 0 ? g.src + (g.src > 1 ? ' actes rattachés' : ' acte rattaché') : 'Aucune source — information non attestée',
      encreSource: g.src > 0 ? '#3D5A8C' : '#9C8F7D',
      pastilleSource: g.src > 0 ? '#3D5A8C' : 'transparent',
      motPivot: asc ? 'Voir sa descendance' : 'Voir son ascendance',
      pivoter: () => { const v = asc ? 'desc' : 'asc'; this.setState({ vue: v, sel: asc ? 'marcel' : 'camille' }); this.recadrer(v); }
    } : null;

    const accent = this.props.accent || '#9A5233';
    const onglet = (nom, icone, actif) => ({ nom, icone, encre: actif ? accent : '#9C8F7D' });

    return {
      hauteur, cadre: `0 0 ${LARGE} ${hauteur}`,
      decoupe: dechirure(LARGE, hauteur),
      basControles: selection ? 190 : 14,
      camera: `translate(${this.state.tx}px, ${this.state.ty}px) scale(${this.state.echelle})`,
      mentions, filiations, unions, fioritures, lacunes, siecles,
      ancre: asc ? 'Ascendance de' : 'Descendance de',
      ancreNom: asc ? 'Camille Vasseur' : 'Marcel Vasseur & Suzanne Chauvet',
      fondAsc: asc ? '#FBF7EF' : 'transparent',
      encreAsc: asc ? '#1F1A14' : '#8A7D6D',
      ombreAsc: asc ? '0 1px 2px rgba(31,26,20,.12)' : 'none',
      fondDesc: asc ? 'transparent' : '#FBF7EF',
      encreDesc: asc ? '#8A7D6D' : '#1F1A14',
      ombreDesc: asc ? 'none' : '0 1px 2px rgba(31,26,20,.12)',
      selection,
      fermer: () => this.setState({ sel: null }),
      versAscendants: () => { this.setState({ vue: 'asc', sel: 'camille' }); this.recadrer('asc'); },
      versDescendants: () => { this.setState({ vue: 'desc', sel: 'marcel' }); this.recadrer('desc'); },
      recentrer: () => this.recadrer(this.state.vue),
      viserSelection: () => { if (selPos) this.setState({ echelle: 1, tx: 195 - selPos.x, ty: 230 - selPos.y }); },
      zoomPlus: () => this.setState(s => ({ echelle: Math.min(1.3, +(s.echelle + 0.12).toFixed(2)) })),
      zoomMoins: () => this.setState(s => ({ echelle: Math.max(0.3, +(s.echelle - 0.12).toFixed(2)) })),
      molette: e => { e.preventDefault(); this.setState(s => ({ echelle: Math.max(0.3, Math.min(1.3, +(s.echelle - e.deltaY * 0.0012).toFixed(3))) })); },
      debutGlisse: e => this.setState({ glisse: { px: e.clientX, py: e.clientY, tx: this.state.tx, ty: this.state.ty } }),
      debutTouche: e => { const t = e.touches[0]; this.setState({ glisse: { px: t.clientX, py: t.clientY, tx: this.state.tx, ty: this.state.ty } }); },
      toucheBouge: e => {
        const gl = this.state.glisse; if (!gl) return;
        const t = e.touches[0];
        this.setState({ tx: gl.tx + (t.clientX - gl.px), ty: gl.ty + (t.clientY - gl.py) });
      },
      finGlisse: () => this.setState({ glisse: null }),
      onglets: [
        onglet('Lignée', 'M12 21v-6M6 15v-4M18 15v-4M6 11h12M6 11V7M18 11V7M9 3h6v4H9z', true),
        onglet('Personnes', 'M9 11a3 3 0 100-6 3 3 0 000 6zM3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M17 8h4M19 6v4', false),
        onglet('Sources', 'M6 3h8l4 4v14H6zM14 3v4h4M9 12h6M9 16h4', false),
        onglet('Membres', 'M8 11a3 3 0 100-6 3 3 0 000 6zM2 20c0-3.3 2.7-6 6-6s6 2.7 6 6M16 5.5a3 3 0 010 5.8M18 14.2c2.4.7 4 2.9 4 5.8', false)
      ]
    };
  }
}
</script>
</body>
</html>
