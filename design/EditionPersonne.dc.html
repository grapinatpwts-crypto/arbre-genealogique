<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap">
  <style>
    body { margin: 0; font-family: 'Archivo', system-ui, sans-serif; }
    a { color: #9A5233; text-decoration: none; } a:hover { color: #7A3F26; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #F3EDE1; color: #1F1A14; display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden">

  <div style="padding: 60px 20px 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px">
    <span style="font-size: 14.5px; font-weight: 500; color: #6E6357; cursor: pointer">Annuler</span>
    <span style="font-family: 'EB Garamond', Georgia, serif; font-size: 20px; font-weight: 600">Modifier la fiche</span>
    <span style="width: 48px"></span>
  </div>

  <div style="flex-grow: 1; overflow: hidden; padding: 6px 20px 0; display: flex; flex-direction: column; gap: 20px">

    <div style="display: flex; flex-direction: column; gap: 12px">
      <span style="font-size: 9.5px; letter-spacing: 0.17em; text-transform: uppercase; color: #8A7D6D; font-weight: 600">Identité</span>

      <div style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 11.5px; color: #6E6357">Prénoms</span>
        <div style="height: 46px; background: #FBF7EF; border: 1px solid #C9BCA6; border-radius: 4px; padding: 0 13px; display: flex; align-items: center; font-size: 15px">Marcel, Auguste, Jean</div>
      </div>

      <div style="display: flex; gap: 10px">
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px">
          <span style="font-size: 11.5px; color: #6E6357">Nom</span>
          <div style="height: 46px; background: #FBF7EF; border: 1px solid #C9BCA6; border-radius: 4px; padding: 0 13px; display: flex; align-items: center; font-size: 15px">Vasseur</div>
        </div>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px">
          <span style="font-size: 11.5px; color: #6E6357">Nom de naissance</span>
          <div style="height: 46px; background: #EFE9DD; border: 1px solid #DCD2C0; border-radius: 4px; padding: 0 13px; display: flex; align-items: center; font-size: 15px; color: #9C8F7D">Identique</div>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 6px">
        <span style="font-size: 11.5px; color: #6E6357">Sexe</span>
        <div style="display: flex; background: #E8E1D3; border: 1px solid #DCD2C0; border-radius: 4px; padding: 3px; gap: 3px">
          <sc-for list="{{sexes}}" as="s" hint-placeholder-count="3">
            <button onClick="{{ s.pick }}" style="flex-grow: 1; height: 40px; border: 0; border-radius: 2px; cursor: pointer; font-family: 'Archivo', sans-serif; font-size: 13.5px; font-weight: 600; background: {{s.fond}}; color: {{s.encre}}; box-shadow: {{s.ombre}}">{{s.nom}}</button>
          </sc-for>
        </div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px">
      <span style="font-size: 9.5px; letter-spacing: 0.17em; text-transform: uppercase; color: #8A7D6D; font-weight: 600">Naissance</span>
      <div style="display: flex; gap: 10px">
        <div style="width: 132px; flex-grow: 0; display: flex; flex-direction: column; gap: 6px">
          <span style="font-size: 11.5px; color: #6E6357">Date</span>
          <div style="height: 46px; background: #FBF7EF; border: 1px solid #C9BCA6; border-radius: 4px; padding: 0 13px; display: flex; align-items: center; font-size: 15px; font-variant-numeric: tabular-nums">14/03/1929</div>
        </div>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px">
          <span style="font-size: 11.5px; color: #6E6357">Lieu</span>
          <div style="height: 46px; background: #FBF7EF; border: 1px solid #C9BCA6; border-radius: 4px; padding: 0 13px; display: flex; align-items: center; font-size: 15px">Saumur (49)</div>
        </div>
      </div>
    </div>

    <div onClick="{{ basculerDeces }}" style="display: flex; align-items: center; gap: 14px; padding: 14px; background: #FBF7EF; border: 1px solid #E4DBCB; border-radius: 4px; cursor: pointer">
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 14.5px; font-weight: 500">Personne décédée</span>
        <span style="font-size: 11.5px; color: #8A7D6D">{{aide}}</span>
      </div>
      <div style="width: 48px; height: 28px; border-radius: 999px; background: {{railFond}}; border: 1px solid {{railBord}}; padding: 2px; display: flex; justify-content: {{railCote}}; flex-grow: 0">
        <div style="width: 22px; height: 22px; border-radius: 50%; background: #FBF7EF; box-shadow: 0 1px 2px rgba(31,26,20,.25)"></div>
      </div>
    </div>

    <sc-if value="{{decede}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; gap: 12px">
        <span style="font-size: 9.5px; letter-spacing: 0.17em; text-transform: uppercase; color: #8A7D6D; font-weight: 600">Décès</span>
        <div style="display: flex; gap: 10px">
          <div style="width: 132px; flex-grow: 0; display: flex; flex-direction: column; gap: 6px">
            <span style="font-size: 11.5px; color: #6E6357">Date</span>
            <div style="height: 46px; background: #FBF7EF; border: 1px solid #C9BCA6; border-radius: 4px; padding: 0 13px; display: flex; align-items: center; font-size: 15px; font-variant-numeric: tabular-nums">02/02/2011</div>
          </div>
          <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px">
            <span style="font-size: 11.5px; color: #6E6357">Lieu</span>
            <div style="height: 46px; background: #FBF7EF; border: 1px solid #C9BCA6; border-radius: 4px; padding: 0 13px; display: flex; align-items: center; font-size: 15px">Angers (49)</div>
          </div>
        </div>
      </div>
    </sc-if>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 11.5px; color: #6E6357">Profession</span>
      <div style="height: 46px; background: #FBF7EF; border: 1px solid #C9BCA6; border-radius: 4px; padding: 0 13px; display: flex; align-items: center; font-size: 15px">Ajusteur-mécanicien</div>
    </div>

  </div>

  <div style="padding: 12px 20px 34px; border-top: 1px solid #E4DBCB; background: #F3EDE1; display: flex; gap: 10px">
    <button style="width: 50px; height: 50px; flex-grow: 0; background: none; border: 1px solid #C9BCA6; border-radius: 4px; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9A5233" stroke-width="1.7" stroke-linecap="square"><path d="M5 7h14M9 7V4h6v3M7 7l1 13h8l1-13" /></svg>
    </button>
    <button style="flex-grow: 1; height: 50px; background: #9A5233; color: #FBF7EF; border: 0; border-radius: 4px; font-family: 'Archivo', sans-serif; font-size: 15px; font-weight: 600; cursor: pointer">Enregistrer</button>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    // La date de décès n'a de sens que si la personne l'est : le bloc n'existe
    // pas tant que l'interrupteur est au repos, plutôt que d'être grisé.
    this.state = { decede: true, sexe: 'M' };
  }
  renderVals() {
    const d = this.state.decede;
    const sexe = (id, nom) => {
      const actif = this.state.sexe === id;
      return {
        nom,
        fond: actif ? '#FBF7EF' : 'transparent',
        encre: actif ? '#1F1A14' : '#8A7D6D',
        ombre: actif ? '0 1px 2px rgba(31,26,20,.12)' : 'none',
        pick: () => this.setState({ sexe: id })
      };
    };
    return {
      sexes: [sexe('M', 'Masculin'), sexe('F', 'Féminin'), sexe('?', 'Inconnu')],
      decede: d,
      aide: d ? 'Ouvre la date et le lieu de décès' : 'Aucune date de décès enregistrée',
      railFond: d ? '#9A5233' : '#DCD2C0',
      railBord: d ? '#9A5233' : '#C9BCA6',
      railCote: d ? 'flex-end' : 'flex-start',
      basculerDeces: () => this.setState({ decede: !this.state.decede })
    };
  }
}
</script>
</body>
</html>
